<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISIT LANKA | Smart Destination Marketplace</title>

    <!-- Same fonts and stylesheet as the rest of the site, so this page
         never looks out of place even for the instant before it redirects -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">

    <!-- Sends browsers straight to the real homepage. The JS redirect below
         fires immediately; this meta tag is just a no-JS fallback. -->
    <meta http-equiv="refresh" content="0; url=home.html">

    <style>
        .splash-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
            padding: 20px;
        }
        .splash-screen h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--gold, #FFD700);
        }
        .splash-screen .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(255, 215, 0, 0.25);
            border-top-color: var(--gold, #FFD700);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .splash-screen a {
            color: var(--gold, #FFD700);
            text-decoration: underline;
            font-size: 0.9rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="splash-screen">
        <h1>VISIT <span>LANKA</span></h1>
        <div class="spinner"></div>
        <p>Loading your Sri Lankan adventure...</p>
        <a href="home.html">Click here if you're not redirected automatically</a>
    </div>

    <script>
        // Primary redirect (instant, no flash of unstyled content since the
        // page above already matches the site's look).
        window.location.replace("home.html");
    </script>

</body>
</html>
