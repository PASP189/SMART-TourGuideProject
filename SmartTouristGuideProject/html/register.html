<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VISIT LANKA | Register</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../css/register.css">
</head>

<body>

<div class="register-container">

<div class="register-card">

<h1>VISIT <span>LANKA</span></h1>

<p>Create Your Smart Travel Planner Account</p>

<form id="registerForm">

<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" id="fullname" placeholder="Full Name" required>
</div>

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email" id="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<i class="fa-solid fa-at"></i>
<input type="text" id="username" placeholder="Username" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="password" placeholder="Password" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="confirmPassword" placeholder="Confirm Password" required>
</div>

<button type="submit">Create Account</button>

</form>

<p class="login-link">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</div>

<script src="../js/register.js"></script>

</body>
</html>
