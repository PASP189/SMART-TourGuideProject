<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Lanka | Create Tourist Account</title>
    <!-- Linking your registration framework to its separate stylesheet files -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CENTRAL LUXURY REGISTRATION CONTAINER CARD -->
    <main class="register-wrapper-card">
        
        <!-- EMBOSSED GOLD BRAND THEME LOGO TITLE -->
        <div class="reg-brand-logo">VISIT <span>LANKA</span></div>
        <p class="reg-sub-heading">Create Your Smart Travel Planner Account</p>

        <!-- REGISTRATION FORM SYSTEM ACTION LAYER -->
        <form class="reg-form" onsubmit="executeSecureRegistration(event)">
            
            <div class="reg-input-group">
                <label for="regFullName">Full Traveler Name:</label>
                <input type="text" id="regFullName" placeholder="e.g., John Doe" required>
            </div>

            <div class="reg-input-group">
                <label for="regEmail">Email Address:</label>
                <input type="email" id="regEmail" placeholder="e.g., john@example.com" required>
            </div>

            <div class="reg-input-group">
                <label for="regUser">Choose Username:</label>
                <input type="text" id="regUser" placeholder="Select unique profile username..." required>
            </div>

            <div class="reg-input-group">
                <label for="regPass">Set Security Password:</label>
                <input type="password" id="regPass" placeholder="Minimum 6 characters long..." required>
            </div>

            <div class="reg-input-group">
                <label for="regConfirmPass">Confirm Security Password:</label>
                <input type="password" id="regConfirmPass" placeholder="Re-type passphrase to confirm..." required>
            </div>

            <!-- SECURITY AGREEMENT TRACKER NOTE BAR -->
            <div class="data-privacy-notice">
                🛡️ Privacy Guarantee: Your user budget records are safely isolated.
            </div>

            <button type="submit" class="reg-submit-btn">Register Account & Explore</button>

            <!-- REDIRECTION LINK ENTRY GATEWAY ROOTING TO LOGIN -->
            <div class="reg-footer-links">
                <span style="color: var(--subdued-blue);">Already have a travel profile?</span>
                <a href="login.html">Sign In Here</a>
            </div>

        </form>

    </main>

    <script>
        // Simulating the user account profile creation pipeline
        function executeSecureRegistration(event) {
            event.preventDefault(); // Blocks default form page reloading actions
            
            let name = document.getElementById('regFullName').value;
            let pass = document.getElementById('regPass').value;
            let confirmPass = document.getElementById('regConfirmPass').value;

            // Form structural validation logic loops
            if (pass !== confirmPass) {
                alert("❌ Registration Error: Passwords do not match. Please verify entries.");
                return;
            }

            if (pass.length < 6) {
                alert("❌ Registration Error: Password must be at least 6 characters long.");
                return;
            }

            alert(`🎉 Welcome to Visit Lanka, ${name}! Your tourist account profile has been successfully generated.`);
            
            // Automatically redirects the browser path straight onto your secure login gate
            window.location.href = "login.html"; 
        }
    </script>
    <!-- INVISIBLE AUDIO LOOP PLAYER CORE LAYER -->
<audio id="ambientAudioNode" loop src="calm-forest.mp3"></audio>

<!-- SUBTLE AUDIO PLAYER INTERACTIVE CONTROL CONTAINER -->
<div style="position: absolute; bottom: 25px; left: 30px; z-index: 100; display: flex; align-items: center; gap: 10px;">
    <button type="button" id="btnAudioToggle" onclick="toggleCalmSystemAudio()" style="background: rgba(1, 10, 23, 0.75); border: 1px solid #dfb26c; color: #dfb26c; border-radius: 50%; width: 40px; height: 40px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4);">
        🔇
    </button>
    <span style="font-size: 0.8rem; font-weight: bold; color: #dfb26c; letter-spacing: 0.5px; text-transform: uppercase; text-shadow: 0 2px 4px black;">
        Ambient Sound Panel
    </span>
</div>

<script>
    // Handles toggling the audio track play states seamlessly
    function toggleCalmSystemAudio() {
        let player = document.getElementById('ambientAudioNode');
        let button = document.getElementById('btnAudioToggle');
        
        if (player.paused) {
            player.play().catch(err => console.log("Audio requires user click first."));
            button.innerText = "🔊";
            button.style.borderColor = "#00cbc6";
            button.style.color = "#00cbc6";
        } else {
            player.pause();
            button.innerText = "🔇";
            button.style.borderColor = "#dfb26c";
            button.style.color = "#dfb26c";
        }
    }
</script>


    

</body>
</html>
